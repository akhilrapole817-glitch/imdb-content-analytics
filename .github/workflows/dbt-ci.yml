name: dbt CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Load CI fixtures
        run: python scripts/load_imdb.py --source fixtures --db ci.duckdb
      - name: dbt build (models + tests)
        env:
          IMDB_DUCKDB_PATH: ci.duckdb
        run: dbt build --profiles-dir .
